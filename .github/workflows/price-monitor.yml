name: Shopee Lazada Price Monitor

on:
  repository_dispatch:
    types: [price-check]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloakbrowser==0.3.30

      - name: Install browser dependencies
        run: |
          python -m cloakbrowser install

      - name: Run price monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python price_monitor.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-monitor-debug
          path: debug/
          if-no-files-found: warn

      - name: Save price state
        run: |
          git config user.name "Price Monitor"
          git config user.email "price-monitor@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "No price state changes."
            exit 0
          fi

          git commit -m "Update price history"

          git pull --rebase origin main
          git push
